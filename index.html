<html lang="zh-CN">
<head>

<title>G.Ark 书签收藏</title>

<style>
:root{
    --bg-gradient: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    --card-bg: rgba(255,255,255,0.12);
    --border-color: rgba(255,255,255,0.18);
    --text-color: #ffffff;
    --input-bg: rgba(255,255,255,0.15);
}

.light{
    --bg-gradient: linear-gradient(135deg,#f5f7fa,#e4ecf7);
    --card-bg: rgba(255,255,255,0.7);
    --border-color: rgba(255,255,255,0.9);
    --text-color: #222;
    --input-bg: rgba(255,255,255,0.9);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:var(--bg-gradient);
    color:var(--text-color);
    transition:.3s ease;
    display:flex;
}

/* 左侧分类栏 */
.sidebar{
    width:180px;
    padding:40px 20px;
    position:fixed;
    left:0;
    top:0;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    margin-bottom:18px;
    cursor:pointer;
    opacity:.7;
    transition:.2s;
}

.sidebar li:hover{
    opacity:1;
}

/* 主体区域 */
.main{
    margin-left:200px;
    width:100%;
    padding:40px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* 头部 */
.header{
    width:100%;
    max-width:1200px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

h1{
    font-weight:600;
    letter-spacing:2px;
}

/* 主题图标 */
.theme-toggle{
    font-size:20px;
    cursor:pointer;
    display:flex;
    gap:15px;
}

/* 搜索框 */
.search-box{
    width:100%;
    max-width:600px;
    margin-bottom:40px;
}

.search-box input{
    width:100%;
    padding:14px 18px;
    border-radius:16px;
    border:none;
    outline:none;
    font-size:15px;
    background:var(--input-bg);
    backdrop-filter:blur(20px);
    color:var(--text-color);
}

/* 分类区块 */
.section{
    width:100%;
    max-width:1200px;
    margin-bottom:50px;
}

.section h2{
    margin-bottom:20px;
    font-size:18px;
    opacity:.8;
}

/* 横向卡片布局 */
.grid{
    display:grid;
    grid-template-columns: repeat(5, 215px);
    justify-content:center;
    gap:20px;
}

/* 卡片 */
.card{
    width:215px;
    height:55px;
    border-radius:14px;
    background:var(--card-bg);
    backdrop-filter:blur(25px);
    border:1px solid var(--border-color);
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:12px;
    cursor:pointer;
    transition:.25s ease;
}

.card:hover{
    transform:translateY(-3px);
}

.card img{
    width:22px;
    height:22px;
}

.card span{
    font-size:14px;
}

/* 平板 */
@media (max-width:1024px){
    .grid{
        grid-template-columns: repeat(3, 215px);
    }
    .sidebar{
        display:none;
    }
    .main{
        margin-left:0;
    }
}

/* 手机 */
@media (max-width:640px){
    .grid{
        grid-template-columns: repeat(2, 215px);
    }
}

</style>
</head>

<body>

<!-- 左侧分类 -->
<div class="sidebar">
    <ul id="categoryList"></ul>
</div>

<div class="main">

<div class="header">
    <h1>G.Ark 书签收藏</h1>
    <div class="theme-toggle">
        <span id="lightMode">☀</span>
        <span id="darkMode">🌙</span>
    </div>
</div>

<div class="search-box">
    <input type="text" id="search" placeholder="搜索网站..." />
</div>

<div id="container"></div>

</div>

const container = document.getElementById("container");
const categoryList = document.getElementById("categoryList");

function render(keyword=""){
    container.innerHTML="";
    categoryList.innerHTML="";

    for(const category in data){

        const sectionId = "section-" + category;
        const filtered = data[category].filter(site =>
            site.name.toLowerCase().includes(keyword.toLowerCase())
        );
        if(filtered.length===0) continue;

        // 左侧分类
        const li=document.createElement("li");
        li.innerText=category;
        li.onclick=()=>{
            document.getElementById(sectionId)
                .scrollIntoView({behavior:"smooth"});
        };
        categoryList.appendChild(li);

        // 内容区
        const section=document.createElement("div");
        section.className="section";
        section.id=sectionId;
        section.innerHTML=`<h2>${category}</h2><div class="grid"></div>`;

        const grid=section.querySelector(".grid");

        filtered.forEach(site=>{
            const card=document.createElement("div");
            card.className="card";
            card.innerHTML=`<img src="${site.icon}"><span>${site.name}</span>`;
            card.onclick=()=>window.open(site.url,"_blank");
            grid.appendChild(card);
        });

        container.appendChild(section);
    }
}

render();

document.getElementById("search").addEventListener("input",e=>{
    render(e.target.value);
});

/* 主题切换 */
document.getElementById("lightMode").onclick=()=>{
    document.body.classList.add("light");
    localStorage.setItem("theme","light");
};

document.getElementById("darkMode").onclick=()=>{
    document.body.classList.remove("light");
    localStorage.setItem("theme","dark");
};

if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
}
</script>
