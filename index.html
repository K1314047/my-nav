<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>G.Ark 书签收藏</title>

<style>
:root{
    --bg-gradient: radial-gradient(circle at top, #2a2110 0%, #0f0f0f 42%, #050505 100%);
    --bg-solid: #0a0a0a;
    --panel-bg: rgba(23, 23, 23, 0.88);
    --panel-strong: rgba(28, 28, 28, 0.95);
    --card-bg: linear-gradient(135deg, rgba(34, 28, 17, 0.92), rgba(19, 19, 19, 0.92));
    --border-color: rgba(212, 175, 55, 0.22);
    --border-strong: rgba(212, 175, 55, 0.45);
    --text-color: #f7f1df;
    --text-soft: rgba(247, 241, 223, 0.72);
    --input-bg: rgba(24, 24, 24, 0.94);
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.12);
    --shadow: 0 10px 30px rgba(0,0,0,0.28);
    --blur: blur(18px);
}

body.light{
    --bg-gradient: linear-gradient(135deg,#f6f8fb,#e7edf7);
    --bg-solid: #f4f7fb;
    --panel-bg: rgba(255,255,255,0.72);
    --panel-strong: rgba(255,255,255,0.88);
    --card-bg: rgba(255,255,255,0.78);
    --border-color: rgba(95, 120, 160, 0.14);
    --border-strong: rgba(95, 120, 160, 0.28);
    --text-color: #1f2937;
    --text-soft: rgba(31, 41, 55, 0.68);
    --input-bg: rgba(255,255,255,0.95);
    --gold: #c69214;
    --gold-soft: rgba(198, 146, 20, 0.10);
    --shadow: 0 10px 28px rgba(60, 72, 88, 0.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:var(--bg-gradient);
    background-color:var(--bg-solid);
    color:var(--text-color);
    transition:background .25s ease,color .25s ease;
}

a{
    color:inherit;
    text-decoration:none;
}

.app{
    max-width:1440px;
    margin:0 auto;
    padding:28px 20px 48px;
    display:grid;
    grid-template-columns: 240px minmax(0, 1fr);
    gap:28px;
}

/* 左侧导航 */
.sidebar{
    position:sticky;
    top:24px;
    align-self:start;
}

.sidebar-card{
    background:var(--panel-bg);
    backdrop-filter:var(--blur);
    border:1px solid var(--border-color);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:18px 14px;
}

.sidebar-title{
    font-size:13px;
    letter-spacing:1px;
    color:var(--text-soft);
    margin-bottom:14px;
    padding:0 8px;
}

.sidebar ul{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.sidebar li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    border-radius:14px;
    cursor:pointer;
    color:var(--text-soft);
    transition:.22s ease;
    border:1px solid transparent;
}

.sidebar li:hover,
.sidebar li.active{
    color:var(--text-color);
    background:var(--gold-soft);
    border-color:var(--border-color);
    transform:translateX(2px);
}

.sidebar .count{
    font-size:12px;
    color:var(--gold);
    opacity:.9;
}

/* 主体 */
.main{
    min-width:0;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:24px;
    padding:4px 2px;
}

.brand{
    display:flex;
    flex-direction:column;
    gap:8px;
}

h1{
    font-size:30px;
    font-weight:700;
    letter-spacing:1px;
}

.subtitle{
    font-size:14px;
    color:var(--text-soft);
}

/* 主题切换 */
.theme-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel-bg);
    border:1px solid var(--border-color);
    border-radius:16px;
    padding:8px;
    backdrop-filter:var(--blur);
    box-shadow:var(--shadow);
}

.theme-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    background:transparent;
    color:var(--text-color);
    transition:.22s ease;
}

.theme-btn:hover,
.theme-btn.active{
    background:var(--gold-soft);
    box-shadow:inset 0 0 0 1px var(--border-strong);
}

/* 搜索 */
.search-wrap{
    margin-bottom:26px;
}

.search-box{
    width:100%;
    max-width:720px;
    margin:0 auto;
    position:relative;
}

.search-box input{
    width:100%;
    padding:16px 18px;
    border-radius:18px;
    border:1px solid var(--border-color);
    outline:none;
    font-size:15px;
    background:var(--input-bg);
    backdrop-filter:var(--blur);
    color:var(--text-color);
    box-shadow:var(--shadow);
    transition:.2s ease;
}

.search-box input:focus{
    border-color:var(--border-strong);
    box-shadow:0 0 0 4px var(--gold-soft);
}

.search-box input::placeholder{
    color:var(--text-soft);
}

/* 手机顶部分类导航 */
.mobile-categories{
    display:none;
    gap:10px;
    overflow-x:auto;
    padding:4px 2px 8px;
    margin-bottom:18px;
    scrollbar-width:none;
}
.mobile-categories::-webkit-scrollbar{
    display:none;
}
.mobile-categories .chip{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:999px;
    background:var(--panel-bg);
    border:1px solid var(--border-color);
    color:var(--text-color);
    cursor:pointer;
    white-space:nowrap;
    font-size:13px;
}

/* 内容区 */
#container{
    width:100%;
}

.section{
    width:100%;
    margin-bottom:44px;
}

.section-header{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:18px;
}

.section h2{
    font-size:20px;
    font-weight:700;
    text-align:center;
    padding:0 18px;
    position:relative;
    color:var(--text-color);
}

.section h2::before,
.section h2::after{
    content:"";
    position:absolute;
    top:50%;
    width:42px;
    height:1px;
    background:linear-gradient(to right, transparent, var(--gold));
    opacity:.7;
}

.section h2::before{
    right:100%;
}
.section h2::after{
    left:100%;
    transform:scaleX(-1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
    gap:16px;
}

/* 卡片 */
.card{
    min-height:68px;
    border-radius:18px;
    background:var(--card-bg);
    backdrop-filter:var(--blur);
    border:1px solid var(--border-color);
    display:flex;
    align-items:center;
    padding:14px 16px;
    gap:12px;
    cursor:pointer;
    transition:.22s ease;
    box-shadow:var(--shadow);
    min-width:0;
}

.card:hover{
    transform:translateY(-4px);
    border-color:var(--border-strong);
    box-shadow:0 12px 28px rgba(0,0,0,0.26);
}

.icon-wrap{
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 38px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
}

body.light .icon-wrap{
    background:rgba(0,0,0,0.04);
}

.card img{
    width:22px;
    height:22px;
    object-fit:contain;
    display:block;
}

.card span{
    font-size:14px;
    line-height:1.35;
    word-break:break-word;
    color:var(--text-color);
}

.empty{
    text-align:center;
    color:var(--text-soft);
    padding:48px 16px;
    font-size:15px;
}

/* 平板 */
@media (max-width: 1100px){
    .app{
        grid-template-columns:1fr;
        gap:20px;
    }

    .sidebar{
        display:none;
    }

    .mobile-categories{
        display:flex;
    }

    h1{
        font-size:26px;
    }
}

/* 手机 */
@media (max-width: 720px){
    .app{
        padding:18px 14px 36px;
    }

    .header{
        flex-direction:column;
        align-items:stretch;
    }

    .brand{
        align-items:center;
        text-align:center;
    }

    .theme-toggle{
        justify-content:center;
    }

    .search-box{
        max-width:100%;
    }

    .grid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
        gap:12px;
    }

    .card{
        min-height:64px;
        padding:12px;
        border-radius:16px;
    }

    .icon-wrap{
        width:34px;
        height:34px;
        flex-basis:34px;
        border-radius:10px;
    }

    .card img{
        width:20px;
        height:20px;
    }

    .card span{
        font-size:13px;
    }

    .section h2{
        font-size:18px;
    }

    .section h2::before,
    .section h2::after{
        width:26px;
    }
}

/* 超小屏 */
@media (max-width: 420px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

</div>

const container = document.getElementById("container");
const categoryList = document.getElementById("categoryList");
const mobileCategoryList = document.getElementById("mobileCategoryList");
const searchInput = document.getElementById("search");
const lightModeBtn = document.getElementById("lightMode");
const darkModeBtn = document.getElementById("darkMode");

let sectionMap = [];

function makeSectionId(index, category) {
    return `section-${index}-${category.replace(/[^\w\u4e00-\u9fa5]+/g, "-")}`;
}

function createNavItem(category, count, sectionId) {
    const li = document.createElement("li");
    li.dataset.target = sectionId;
    li.innerHTML = `<span>${category}</span><span class="count">${count}</span>`;
    li.onclick = () => {
        document.getElementById(sectionId)?.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    return li;
}

function createMobileChip(category, sectionId) {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = category;
    chip.onclick = () => {
        document.getElementById(sectionId)?.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    return chip;
}

function createCard(site) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="icon-wrap">
            <img src="${site.icon}" alt="${site.name}" loading="lazy">
        </div>
        <span>${site.name}</span>
    `;

    const img = card.querySelector("img");
    img.onerror = function () {
        this.style.display = "none";
        this.parentElement.textContent = site.name.charAt(0).toUpperCase();
        this.parentElement.style.fontSize = "14px";
        this.parentElement.style.color = "var(--gold)";
        this.parentElement.style.fontWeight = "700";
    };

    card.onclick = () => {
        window.open(site.url, "_blank", "noopener,noreferrer");
    };

    return card;
}

function render(keyword = "") {
    container.innerHTML = "";
    categoryList.innerHTML = "";
    mobileCategoryList.innerHTML = "";
    sectionMap = [];

    const normalizedKeyword = keyword.trim().toLowerCase();
    let hasResult = false;

    Object.keys(data).forEach((category, index) => {
        const filtered = data[category].filter(site =>
            site.name.toLowerCase().includes(normalizedKeyword)
        );

        if (filtered.length === 0) return;
        hasResult = true;

        const sectionId = makeSectionId(index, category);
        sectionMap.push(sectionId);

        categoryList.appendChild(createNavItem(category, filtered.length, sectionId));
        mobileCategoryList.appendChild(createMobileChip(category, sectionId));

        const section = document.createElement("section");
        section.className = "section";
        section.id = sectionId;

        const header = document.createElement("div");
        header.className = "section-header";
        header.innerHTML = `<h2>${category}</h2>`;

        const grid = document.createElement("div");
        grid.className = "grid";

        filtered.forEach(site => {
            grid.appendChild(createCard(site));
        });

        section.appendChild(header);
        section.appendChild(grid);
        container.appendChild(section);
    });

    if (!hasResult) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有找到匹配的网站";
        container.appendChild(empty);
    }

    setTimeout(initSectionObserver, 60);
}

function initSectionObserver() {
    const sections = document.querySelectorAll(".section");
    const navItems = document.querySelectorAll(".sidebar li");
    if (!sections.length || !navItems.length) return;

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                navItems.forEach(item => item.classList.remove("active"));
                const activeItem = [...navItems].find(item => item.dataset.target === entry.target.id);
                if (activeItem) activeItem.classList.add("active");
            }
        });
    }, {
        root: null,
        threshold: 0.2,
        rootMargin: "-20% 0px -60% 0px"
    });

    sections.forEach(section => observer.observe(section));
}

searchInput.addEventListener("input", e => {
    render(e.target.value);
});

function setTheme(mode) {
    if (mode === "light") {
        document.body.classList.add("light");
        lightModeBtn.classList.add("active");
        darkModeBtn.classList.remove("active");
        localStorage.setItem("theme", "light");
    } else {
        document.body.classList.remove("light");
        darkModeBtn.classList.add("active");
        lightModeBtn.classList.remove("active");
        localStorage.setItem("theme", "dark");
    }
}

lightModeBtn.onclick = () => setTheme("light");
darkModeBtn.onclick = () => setTheme("dark");

const savedTheme = localStorage.getItem("theme") || "dark";
setTheme(savedTheme);

render();
</script>
